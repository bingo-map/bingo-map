<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 | BinGo Map</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/notices/Notices.css">
    <link rel="stylesheet" href="/css/site-header.css">
</head>
<body>
<header class="header">
    <div class="header-inner">
        <a class="logo" href="/">
            <span class="logo-mark">♜</span>
            <span>
                <strong>BinGo Map</strong>
                <small>Clean &amp; Gourmet</small>
            </span>
        </a>

        <nav class="nav">
            <a href="/">홈</a>
            <a href="/map">지도</a>
            <a href="/restaurants">주변 맛집</a>
            <a href="/favorites">즐겨찾기</a>
            <a href="/reviews">리뷰</a>
            <a href="/community">커뮤니티</a>
            <a class="active" href="/notices">공지사항</a>
        </nav>

        <div class="header-actions">
            <button class="language">🇰🇷 한국어 <span>⌄</span></button>
            <a class="login" href="/login">로그인</a>
        </div>
    </div>
</header>

<main>
    <section class="section">
        <h2 class="section-title">공지사항</h2>
        <div class="title-line"></div>
        <div class="notice-toolbar" id="notice-admin-toolbar" hidden><p id="notice-message" role="status"></p><button id="notice-new-btn" type="button">+ 공지 작성</button></div>
        <form id="notice-form" class="notice-form" hidden>
            <input id="notice-form-id" type="hidden">
            <label>제목<input id="notice-title" type="text" maxlength="200" required></label>
            <label>내용<textarea id="notice-content" rows="7" required></textarea></label>
            <label class="notice-pin-option"><input id="notice-pinned" type="checkbox"> 상단 고정</label>
            <p id="notice-form-message" role="alert"></p>
            <div><button type="submit" class="notice-save">저장</button><button type="button" id="notice-cancel">취소</button></div>
        </form>
        <div id="notice-list" class="notice-list"></div>
        <p id="notice-empty" class="notice-empty" hidden>등록된 공지사항이 없습니다.</p>
    </section>
</main>

<footer class="footer">
    <div class="footer-inner">
        <div class="footer-brand">
            <span class="logo-mark">♜</span>
            <span><strong>BinGo Map</strong><small>Clean &amp; Gourmet</small></span>
        </div>
        <p>BinGo Map은 깨끗한 일본 여행 문화를 응원합니다.<br>모두가 함께 만들어가는 깨끗하고 즐거운 여행 플랫폼!</p>
        <div class="footer-links">
            <div>◎ ♥ f</div>
            <small>이용약관  개인정보처리방침  문의하기</small>
            <small>© 2026 BinGo Map. All rights reserved.</small>
        </div>
        <a class="top-btn" href="#">↑<small>TOP</small></a>
    </div>
</footer>
<script src="/notices/Notices.js"></script>
<script src="/js/header-auth.js"></script>
</body>
</html>
