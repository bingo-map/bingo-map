<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${restaurant != null ? restaurant.name + ' - BinGo Map' : '맛집 상세 정보 - BinGo Map'}">맛집 상세 정보 - BinGo Map</title>

    <!-- 부트스트랩 5 CSS 및 부트스트랩 아이콘 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .navbar-brand-logo {
            font-weight: 800;
            color: #198754 !important;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .main-gallery-img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            border-radius: 12px;
            background-color: #e9ecef;
        }
        .info-card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #edf2f7;
        }
        .tag-pill {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            color: #ffffff;
            background-color: #198754;
            display: inline-block;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<!-- 상단 헤더 -->
<header class="bg-white border-bottom py-2 sticky-top">
    <div class="container d-flex align-items-center justify-content-between">
        <a href="/" class="navbar-brand-logo text-decoration-none fs-4">
            <i class="bi bi-trash3-fill fs-3 text-success"></i>
            <div>
                <div>BinGo Map</div>
                <div style="font-size: 0.65rem; color: #6c757d; font-weight: normal; margin-top: -4px;">Clean & Gourmet</div>
            </div>
        </a>
        <nav class="d-none d-md-flex gap-4 fw-semibold text-secondary">
            <a href="/" class="text-decoration-none text-secondary">홈</a>
            <a href="/map/map.html" class="text-decoration-none text-secondary">지도</a>
            <a href="/restaurants" class="text-decoration-none text-success border-bottom border-success border-2 pb-1">주변 맛집</a>
            <a href="/favorites/favorites.html" class="text-decoration-none text-secondary">즐겨찾기</a>
            <a href="/reviews/reviews.html" class="text-decoration-none text-secondary">리뷰</a>
            <a href="/notices/notices.html" class="text-decoration-none text-secondary">공지사항</a>
        </nav>
        <div class="d-flex align-items-center gap-3">
            <span class="small text-muted"><i class="bi bi-globe"></i> 한국어 ▾</span>
            <a href="/login/login.html" class="btn btn-success btn-sm px-3 rounded-2">로그인</a>
        </div>
    </div>
</header>

<main class="container my-4">
    <!-- 목록 이동 링크 -->
    <div class="mb-3">
        <a href="/restaurants" class="text-decoration-none text-dark fw-medium small">
            <i class="bi bi-arrow-left"></i> 목록으로 돌아가기
        </a>
    </div>

    <!-- [1구역: 매장 대표 정보] -->
    <div class="row g-4 mb-4">
        <!-- 대표 이미지 -->
        <div class="col-lg-6">
            <img id="store-image"
                 th:src="${restaurant != null && restaurant.mainImageUrl != null && !#strings.isEmpty(restaurant.mainImageUrl) ? restaurant.mainImageUrl : 'https://via.placeholder.com/600x380?text=No+Image'}"
                 class="main-gallery-img"
                 alt="가게 대표 사진"
                 onerror="this.src='https://via.placeholder.com/600x380?text=No+Image'">
        </div>

        <!-- 기본 텍스트 정보 -->
        <div class="col-lg-6 d-flex flex-column justify-content-center">
            <div>
                <span class="tag-pill" th:text="${restaurant != null ? restaurant.category : '기타'}">카테고리</span>
            </div>

            <h2 id="store-name" class="fw-bold mb-2" th:text="${restaurant != null ? restaurant.name : '가게 이름'}">
                가게 이름
            </h2>

            <p id="store-description" class="text-secondary mb-3" th:text="${restaurant != null ? restaurant.description : '가게 소개글이 없습니다.'}">
                가게 한 줄 소개
            </p>

            <div class="small text-secondary mb-2">
                <i class="bi bi-geo-alt me-2 text-success"></i>
                <span id="store-address" th:text="${restaurant != null ? restaurant.address : '주소 미등록'}">가게 위치 주소</span>
            </div>

            <div class="small text-secondary mb-2" th:if="${restaurant != null && restaurant.phone != null}">
                <i class="bi bi-telephone me-2 text-success"></i>
                <span th:text="${restaurant.phone}">전화번호</span>
            </div>

            <div class="small text-secondary" th:if="${restaurant != null && restaurant.priceRange != null}">
                <i class="bi bi-cash-coin me-2 text-success"></i>
                <span th:text="${restaurant.priceRange}">가격대</span>
            </div>
        </div>
    </div>

    <!-- [2구역: 대표 메뉴 목록 - 에러 방지 처리] -->
    <div class="row">
        <div class="col-12">
            <div class="info-card">
                <h5 class="fw-bold mb-3">대표 메뉴</h5>
                <div class="text-center py-4 text-muted small">
                    <i class="bi bi-card-list fs-3 d-block mb-2"></i>
                    등록된 세부 메뉴 정보가 없습니다. (준비 중)
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
