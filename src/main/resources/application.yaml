# ==============================================================================
# [application.yml]
# 스프링 부트(Spring Boot)의 데이터베이스 연결 및 서버 환경 설정 파일입니다.
# YAML(야믈) 파일은 띄어쓰기(들여쓰기 2칸)가 문법이므로 간격이 틀어지지 않게 주의해야 합니다.
# ==============================================================================

spring:
  application:
    # [프로젝트 이름] 스프링 부트 애플리케이션의 고유 이름입니다.
    name: bingo-map

  # ============================================================================
  # [오라클 데이터베이스(DB) 연결 설정 (DataSource)]
  # ============================================================================
  datasource:
    # 1. DB 접속 주소 (URL)
    # - jdbc:oracle:thin : 자바에서 오라클에 가볍고 빠르게 붙을 수 있는 표준 연결 드라이버 방식
    # - @//localhost : 내 컴퓨터(로컬 PC)에서 돌고 있는 오라클 서버
    # - 1521 : 오라클 기본 포트 번호
    # - /orcl : 오라클 데이터베이스 서비스 이름 (환경에 따라 xe, orcl, xepdb1 등으로 설정)
    url: jdbc:oracle:thin:@//localhost:1521/orcl

    # 2. 오라클 계정 아이디
    username: scott

    # 3. 오라클 계정 비밀번호
    password: tiger

    # 4. 자바 프로그램이 오라클 DB와 통신할 때 사용하는 공식 통역관(드라이버 클래스 이름)
    driver-class-name: oracle.jdbc.OracleDriver

  # ============================================================================
  # [JPA 및 하이버네이트(Hibernate) 설정]
  # - JPA란?: SQL 쿼리문을 일일이 손으로 치지 않아도, 자바 객체(Entity)로 DB를 다루게 해주는 도구
  # ============================================================================
  jpa:
    hibernate:
      # ddl-auto (테이블 자동 생성 관리 옵션)
      # - none : 서버가 켜질 때 DB 테이블을 건드리지 않고 그대로 유지합니다.
      #          (오라클에서 직접 CREATE TABLE로 테이블을 만들어 두었으므로 'none'으로 설정해야 데이터가 안 날아갑니다!)
      # - update, create 등 다른 옵션을 쓰면 기존 데이터나 시퀀스가 덮어씌워지거나 지워질 수 있어 실무/팀플에서는 none을 권장합니다.
      ddl-auto: none

    # show-sql : 웹 브라우저에서 조회가 일어날 때 스프링이 실행한 SQL문을 콘솔(이클립스 하단 창)에 찍어줄지 여부 (true = 콘솔에 출력)
    show-sql: true

    properties:
      hibernate:
        # format_sql : 콘솔 창에 찍히는 긴 SQL 한 줄을 줄바꿈과 들여쓰기를 넣어서 사람이 읽기 편하게 예쁘게 정렬해 줍니다.
        format_sql: true

# ==============================================================================
# [내장 톰캣 웹 서버 설정]
# ==============================================================================
server:
  # 웹 브라우저 접속 포트 번호 (http://localhost:8080 으로 웹사이트 접속)
  port: 8080