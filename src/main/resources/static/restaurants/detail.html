<!DOCTYPE html>
<!-- 타임리프(Thymeleaf: 자바 스프링 부트 서버에서 보낸 DB 데이터를 HTML에 자동으로 채워주는 도구) 문법 선언 -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- 뷰포트(Viewport: 모바일, 태블릿, PC 화면 크기에 맞춰 레이아웃을 자동 조절해주는 반응형 설정) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- [웹 브라우저 탭 제목]: DB에 식당 이름이 있으면 해당 이름을 띄우고, 없으면 기본 글자를 보여줍니다 -->
    <title th:text="${restaurant != null ? restaurant.name + ' - BinGo Map' : '맛집 상세 정보 - BinGo Map'}">맛집 상세 정보 - BinGo Map</title>

    <!-- 부트스트랩 5 CSS(버튼, 카드, 정렬 등 기본 디자인을 예쁘게 만들어주는 스타일 도구) 및 아이콘 라이브러리 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS(Cascading Style Sheets: 화면을 꾸미는 전용 스타일 코드) -->
    <style>
        body {
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .navbar-brand-logo {
            font-weight: 800;
            color: #198754 !important;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* 대표 이미지 스타일: 사진 비율을 맞추고 로딩 전에는 연한 회색 배경 지정 */
        .main-gallery-img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            border-radius: 12px;
            background-color: #e9ecef;
        }
        /* 카드 박스 스타일: 하얀 배경과 둥근 모서리 */
        .info-card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #edf2f7;
        }
        /* 메뉴 썸네일(Thumbnail: 한눈에 보기 편하게 작게 줄여놓은 견본 사진) 이미지 */
        .menu-thumb {
            width: 64px;
            height: 64px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #e9ecef;
        }
    </style>
</head>
<body>

<!-- ================================================================= -->
<!-- [상단 헤더]: 다른 페이지로 이동하는 내비게이션(Navigation: 메뉴 링크 모음) -->
<!-- ================================================================= -->
<header class="bg-white border-bottom py-2 sticky-top">
    <div class="container d-flex align-items-center justify-content-between">
        <!-- 홈 화면 이동 로고 -->
        <a href="/" class="navbar-brand-logo text-decoration-none fs-4">
            <i class="bi bi-trash3-fill fs-3 text-success"></i>
            <div>
                <div>BinGo Map</div>
                <div style="font-size: 0.65rem; color: #6c757d; font-weight: normal; margin-top: -4px;">Clean & Gourmet</div>
            </div>
        </a>
        <!-- 주요 메뉴 링크 -->
        <nav class="d-none d-md-flex gap-4 fw-semibold text-secondary">
            <a href="/" class="text-decoration-none text-secondary">홈</a>
            <a href="/map/map.html" class="text-decoration-none text-secondary">지도</a>
            <a href="/restaurants" class="text-decoration-none text-success border-bottom border-success border-2 pb-1">주변 맛집</a>
        </nav>
        <!-- 로그인 버튼 -->
        <div class="d-flex align-items-center gap-3">
            <a href="/login/login.html" class="btn btn-success btn-sm px-3 rounded-2">로그인</a>
        </div>
    </div>
</header>

<!-- ================================================================= -->
<!-- [메인 본문 영역]: th:if -> DB에서 식당 정보를 성공적으로 찾았을 때만 출력 -->
<!-- ================================================================= -->
<main class="container my-4" th:if="${restaurant != null}">
    <!-- 목록 이동 링크 -->
    <div class="mb-3">
        <a href="/restaurants" class="text-decoration-none text-dark fw-medium small">
            <i class="bi bi-arrow-left"></i> 목록으로 돌아가기
        </a>
    </div>

    <!-- ============================================================= -->
    <!-- [1구역: 가게 핵심 정보] 대표 사진 및 매장 이름/소개/주소 -->
    <!-- ============================================================= -->
    <div class="row g-4 mb-4">

        <!-- [1-1. 가게 대표 이미지 영역] -->
        <!--
            th:src: 이미지 주소 연결 속성
            DB의 MAIN_IMAGE_URL 컬럼 값이 있으면 가져오고, 없으면 기본 임시 이미지를 띄웁니다.
        -->
        <div class="col-lg-6">
            <img id="store-image"
                 th:src="${restaurant.mainImageUrl != null ? restaurant.mainImageUrl : 'https://via.placeholder.com/600x400?text=Store+Image'}"
                 class="main-gallery-img"
                 alt="가게 대표 사진">
        </div>

        <!-- [1-2. 가게 기본 텍스트 정보 영역] -->
        <div class="col-lg-6 d-flex flex-column justify-content-center">

            <!--
                [가게 이름]
                th:text: DB의 NAME 컬럼 데이터를 글자로 화면에 출력합니다.
            -->
            <h2 id="store-name" class="fw-bold mb-2" th:text="${restaurant.name}">
                가게 이름 (DB: NAME)
            </h2>

            <!--
                [가게 한 줄 소개 및 카테고리]
                th:text: DB의 DESCRIPTION(소개글) 컬럼 데이터를 화면에 출력합니다.
            -->
            <p id="store-description" class="text-secondary mb-3" th:text="${restaurant.description}">
                가게 한 줄 소개 또는 카테고리 (DB: DESCRIPTION / CATEGORY)
            </p>

            <!--
                [가게 주소]
                th:text: DB의 ADDRESS(주소) 컬럼 데이터를 화면에 출력합니다.
            -->
            <div class="small text-secondary">
                <i class="bi bi-geo-alt me-2 text-success"></i>
                <span id="store-address" th:text="${restaurant.address}">가게 위치 주소 (DB: ADDRESS)</span>
            </div>

        </div>
    </div>

    <!-- ============================================================= -->
    <!-- [2구역: 메뉴 목록 영역] 해당 가게의 메뉴 카드 -->
    <!-- ============================================================= -->
    <div class="row">
        <div class="col-12">
            <div class="info-card">
                <h5 class="fw-bold mb-3">메뉴</h5>

                <!--
                    [DB 반복문(Loop) 컨테이너]
                    나중에 별도의 메뉴 테이블(MENU)을 연결할 때,
                    th:each="menu : ${menuList}" 문법을 걸어주면 이 안쪽 카드들이 메뉴 개수만큼 자동 복제됩니다.
                -->
                <div id="menu-list" class="d-flex flex-column gap-3">

                    <!-- ========== [개별 메뉴 카드 샘플 (추후 DB 메뉴 연동 대상)] ========== -->
                    <div class="menu-item d-flex align-items-center justify-content-between p-2 border-bottom">
                        <div class="d-flex align-items-center gap-3">

                            <!-- [메뉴 사진]: 추후 DB 매핑 예정 (MENU 테이블의 IMAGE_URL) -->
                            <img src="https://via.placeholder.com/64?text=Menu"
                                 class="menu-thumb"
                                 alt="메뉴 사진">

                            <div>
                                <!-- [메뉴명]: 추후 DB 매핑 예정 (MENU 테이블의 NAME) -->
                                <div class="fw-bold small menu-title">
                                    '카라아게 타로',
                                    '닭튀김',
                                    '치킨,가라아게,맥주안주',
                                </div>

                                <!-- [메뉴 간단 설명]: 추후 DB 매핑 예정 (MENU 테이블의 DESCRIPTION) -->
                                <div class="text-muted menu-desc" style="font-size: 0.8rem;">
                                    겉은 바삭하고 속은 촉촉한 대표 메뉴
                                </div>
                            </div>
                        </div>

                        <!-- [메뉴 가격]: 추후 DB 매핑 예정 (MENU 테이블의 PRICE) -->
                        <div class="fw-bold small menu-price">
                            ¥680
                        </div>
                    </div>
                    <!-- ========== [개별 메뉴 카드 샘플 끝] ========== -->

                </div>
                <!-- [메뉴 컨테이너 끝] -->

            </div>
        </div>
    </div>
</main>

<!-- 데이터가 없을 때 띄워줄 안내창 -->
<div class="container my-5 text-center" th:if="${restaurant == null}">
    <p class="text-muted">해당 가게 정보를 찾을 수 없습니다.</p>
    <a href="/restaurants" class="btn btn-sm btn-outline-secondary">목록으로 돌아가기</a>
</div>

<!-- 부트스트랩 기능(반응형 지원 등) 자바스크립트 라이브러리 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
