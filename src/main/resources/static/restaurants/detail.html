<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맛집 상세 정보 - BinGo Map</title>

    <!-- 부트스트랩 5 CSS 및 부트스트랩 아이콘 (디자인 유지용) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .navbar-brand-logo {
            font-weight: 800;
            color: #198754 !important;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* 대표 이미지: 비율 유지 및 로딩 전 회색 배경 지정 */
        .main-gallery-img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            border-radius: 12px;
            background-color: #e9ecef;
        }
        /* 상세 정보 박스 스타일 */
        .info-card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #edf2f7;
        }
        /* 메뉴 썸네일 이미지 크기 고정 */
        .menu-thumb {
            width: 64px;
            height: 64px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #e9ecef;
        }
    </style>
</head>
<body>

<!-- ================================================================= -->
<!-- [상단 헤더]: 웹사이트 기본 네비게이션 영역 -->
<!-- ================================================================= -->
<header class="bg-white border-bottom py-2 sticky-top">
    <div class="container d-flex align-items-center justify-content-between">
        <a href="/" class="navbar-brand-logo text-decoration-none fs-4">
            <i class="bi bi-trash3-fill fs-3 text-success"></i>
            <div>
                <div>BinGo Map</div>
                <div style="font-size: 0.65rem; color: #6c757d; font-weight: normal; margin-top: -4px;">Clean & Gourmet</div>
            </div>
        </a>
        <nav class="d-none d-md-flex gap-4 fw-semibold text-secondary">
            <a href="/" class="text-decoration-none text-secondary">홈</a>
            <a href="/map/map.html" class="text-decoration-none text-secondary">지도</a>
            <a href="/restaurants" class="text-decoration-none text-success border-bottom border-success border-2 pb-1">주변 맛집</a>
        </nav>
        <div class="d-flex align-items-center gap-3">
            <a href="/login/login.html" class="btn btn-success btn-sm px-3 rounded-2">로그인</a>
        </div>
    </div>
</header>

<!-- ================================================================= -->
<!-- [메인 콘텐츠]: 가게 상세 정보 렌더링 영역 -->
<!-- ================================================================= -->
<main class="container my-4">
    <!-- 목록 이동 링크 -->
    <div class="mb-3">
        <a href="/restaurants" class="text-decoration-none text-dark fw-medium small">
            <i class="bi bi-arrow-left"></i> 목록으로 돌아가기
        </a>
    </div>

    <!-- ============================================================= -->
    <!-- [1구역: 가게 핵심 정보] 대표 사진 및 매장 이름/주소 -->
    <!-- ============================================================= -->
    <div class="row g-4 mb-4">

        <!-- [1-1. 가게 대표 이미지 영역] -->
        <!-- DB 매핑 예시: Store.imageUrl 또는 Store.imagePath -->
        <div class="col-lg-6">
            <img
                    id="store-image"
                    src="https://via.placeholder.com/600x400?text=Store+Image"
                    class="main-gallery-img"
                    alt="가게 대표 사진"
            >
        </div>

        <!-- [1-2. 가게 기본 텍스트 정보 영역] -->
        <div class="col-lg-6 d-flex flex-column justify-content-center">

            <!-- [가게 이름]: DB 매핑 예시: Store.name -->
            <h2 id="store-name" class="fw-bold mb-2">
                가게 이름 (DB: name)
            </h2>

            <!-- [가게 한 줄 소개 / 카테고리]: DB 매핑 예시: Store.description 또는 Store.category -->
            <p id="store-description" class="text-secondary mb-3">
                가게 한 줄 소개 또는 카테고리 (DB: description / category)
            </p>

            <!-- [가게 주소]: DB 매핑 예시: Store.address -->
            <div class="small text-secondary">
                <i class="bi bi-geo-alt me-2 text-success"></i>
                <span id="store-address">가게 위치 주소 (DB: address)</span>
            </div>

        </div>
    </div>

    <!-- ============================================================= -->
    <!-- [2구역: 메뉴 목록 영역] 해당 가게의 메뉴 카드 -->
    <!-- ============================================================= -->
    <div class="row">
        <div class="col-12">
            <div class="info-card">
                <h5 class="fw-bold mb-3">메뉴</h5>

                <!--
                    [DB 반복문(Loop) 시작 컨테이너]
                    백엔드 템플릿(Thymeleaf의 th:each 등)이나 JS의 forEach/map 함수로
                    아래 'menu-item' 블록을 메뉴 데이터 개수만큼 반복 생성합니다.
                -->
                <div id="menu-list" class="d-flex flex-column gap-3">

                    <!-- ========== [개별 메뉴 카드 단위 시작 (반복 대상)] ========== -->
                    <div class="menu-item d-flex align-items-center justify-content-between p-2 border-bottom">
                        <div class="d-flex align-items-center gap-3">

                            <!-- [메뉴 사진]: DB 매핑 예시: Menu.imageUrl -->
                            <img
                                    src="https://via.placeholder.com/64?text=Menu"
                                    class="menu-thumb"
                                    alt="메뉴 사진"
                            >

                            <div>
                                <!-- [메뉴명]: DB 매핑 예시: Menu.name -->
                                <div class="fw-bold small menu-title">
                                    메뉴 이름 (DB: menu_name)
                                </div>

                                <!-- [메뉴 간단 설명]: DB 매핑 예시: Menu.description -->
                                <div class="text-muted menu-desc" style="font-size: 0.8rem;">
                                    메뉴 설명 (DB: menu_desc)
                                </div>
                            </div>
                        </div>

                        <!-- [메뉴 가격]: DB 매핑 예시: Menu.price -->
                        <div class="fw-bold small menu-price">
                            ₩0,000 (DB: price)
                        </div>
                    </div>
                    <!-- ========== [개별 메뉴 카드 단위 끝] ========== -->

                </div>
                <!-- [DB 반복문 컨테이너 끝] -->

            </div>
        </div>
    </div>
</main>

<!-- 부트스트랩 스크립트 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
