<!DOCTYPE html>
<!-- 타임리프(Thymeleaf: 스프링 서버에서 넘겨받은 DB 데이터를 HTML 화면에 동적으로 꽂아주는 도구) 문법 선언 -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- 뷰포트(Viewport: 스마트폰, 태블릿, PC 등 기기 화면 크기에 맞게 배율을 자동 조절하는 반응형 웹 설정) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- [웹 브라우저 탭 제목]: DB에 식당 이름이 있으면 해당 이름을 띄우고, 없으면 기본 문구를 출력합니다 -->
    <title th:text="${restaurant != null ? restaurant.name + ' - BinGo Map' : '맛집 상세 - BinGo Map'}">쿠쿠루 도톤보리 본점 - BinGo Map</title>

    <!-- 부트스트랩 5 CSS(버튼, 카드, 레이아웃 등 UI 디자인 도구) 및 부트스트랩 아이콘 라이브러리 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS(화면 스타일 지정 구역) -->
    <style>
        body { background-color: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .navbar-brand-logo { font-weight: 800; color: #198754 !important; display: flex; align-items: center; gap: 8px; }
        .badge-tag-orange { background-color: #ff781f; color: #fff; }
        .main-gallery-img { width: 100%; height: 380px; object-fit: cover; border-radius: 12px; background-color: #dee2e6; }
        .action-btn { border: 1px solid #dee2e6; background-color: #fff; padding: 10px 16px; border-radius: 8px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; color: #495057; text-decoration: none; }
        .action-btn:hover { background-color: #f1f3f5; color: #212529; }
        .info-card { background: #fff; border-radius: 12px; padding: 24px; height: 100%; border: 1px solid #edf2f7; }
        .menu-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }

        /* 지도 연동 전 임시 플레이스홀더(Placeholder: 실제 지도를 붙이기 전 자리를 잡아두는 점선 박스) */
        .map-placeholder {
            background-color: #f1f3f5;
            border: 1px dashed #ced4da;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #6c757d;
        }
    </style>
</head>
<body>

<!-- ================================================================= -->
<!-- [상단 헤더]: 다른 페이지로 이동하는 공통 메뉴 바 -->
<!-- ================================================================= -->
<header class="bg-white border-bottom py-2 sticky-top">
    <div class="container d-flex align-items-center justify-content-between">
        <!-- 홈 이동 로고 -->
        <a href="/" class="navbar-brand-logo text-decoration-none fs-4">
            <i class="bi bi-trash3-fill fs-3 text-success"></i>
            <div>
                <div>BinGo Map</div>
                <div style="font-size: 0.65rem; color: #6c757d; font-weight: normal; margin-top: -4px;">Clean & Gourmet</div>
            </div>
        </a>
        <!-- 상단 메뉴 목록 -->
        <nav class="d-none d-md-flex gap-4 fw-semibold text-secondary">
            <a href="/" class="text-decoration-none text-secondary">홈</a>
            <a href="/map/map.html" class="text-decoration-none text-secondary">지도</a>
            <a href="/restaurants" class="text-decoration-none text-success border-bottom border-success border-2 pb-1">주변 맛집</a>
        </nav>
        <!-- 우측 로그인 버튼 -->
        <div class="d-flex align-items-center gap-3">
            <a href="/login/login.html" class="btn btn-success btn-sm px-3 rounded-2">로그인</a>
        </div>
    </div>
</header>

<!-- ================================================================= -->
<!-- [메인 본문]: th:if -> DB에서 식당 정보를 성공적으로 찾았을 때만 화면 출력 -->
<!-- ================================================================= -->
<main class="container my-4" th:if="${restaurant != null}">

    <!-- [상단: 뒤로가기 링크] (즐겨찾기 버튼이 제거되어 목록 이동 링크만 깔끔하게 남음) -->
    <div class="mb-3">
        <a href="/restaurants" class="text-decoration-none text-dark fw-medium small">
            <i class="bi bi-arrow-left"></i> 주변 맛집으로 돌아가기
        </a>
    </div>

    <!-- ============================================================= -->
    <!-- [1구역: 식당 대표 사진 및 기본 프로필 정보] -->
    <!-- ============================================================= -->
    <div class="row g-4 mb-4">

        <!-- [좌측: 대표 사진] DB의 MAIN_IMAGE_URL 값을 가져오며, 없을 시 기본 이미지 출력 -->
        <div class="col-lg-6">
            <div class="position-relative mb-2">
                <img th:src="${restaurant.mainImageUrl != null ? restaurant.mainImageUrl : '/images/food-takoyaki.png'}"
                     class="main-gallery-img" alt="대표 이미지">
            </div>
        </div>

        <!-- [우측: 식당 텍스트 정보 및 실행 버튼] -->
        <div class="col-lg-6 d-flex flex-column justify-content-between">
            <div>
                <!-- [음식 분류 태그]: DB의 CATEGORY 컬럼 -->
                <div class="d-flex gap-2 mb-2">
                    <span class="badge badge-tag-orange px-2 py-1" th:text="${restaurant.category}">타코야끼</span>
                </div>

                <!-- [식당 이름]: DB의 NAME 컬럼 -->
                <div class="d-flex align-items-center gap-2 mb-2">
                    <h2 class="fw-bold mb-0" th:text="${restaurant.name}">쿠쿠루 도톤보리 본점</h2>
                    <i class="bi bi-patch-check-fill text-success fs-5"></i>
                </div>

                <!-- [별점 평점 및 리뷰 수]: DB의 RATING, REVIEW_COUNT 컬럼 -->
                <div class="d-flex align-items-center gap-3 text-secondary mb-3 small">
                    <span>
                        <i class="bi bi-star-fill text-warning"></i>
                        <strong class="text-dark" th:text="${restaurant.rating}">4.6</strong>
                        (<span th:text="${restaurant.reviewCount}">1,248</span>)
                    </span>
                </div>

                <!-- [식당 한 줄 소개]: DB의 DESCRIPTION 컬럼 -->
                <p class="text-secondary small mb-4" th:text="${restaurant.description}">
                    겉은 바삭, 속은 촉촉! 도톤보리 대표 타코야끼 맛집
                </p>

                <!-- [세부 운영 정보]: 주소, 영업시간, 전화번호, 가격대, 공식 웹사이트 -->
                <div class="small d-flex flex-column gap-2 text-secondary">
                    <div><i class="bi bi-geo-alt me-2 text-success"></i> <span th:text="${restaurant.address}">오사카시 주오구</span></div>
                    <div><i class="bi bi-clock me-2 text-success"></i> <span th:text="${restaurant.openingHours}">09:00 - 21:00</span></div>
                    <div><i class="bi bi-telephone me-2 text-success"></i> <span th:text="${restaurant.phone}">+81 6-6211-5512</span></div>
                    <div><i class="bi bi-cash-coin me-2 text-success"></i> <span th:text="${restaurant.priceRange}">¥500 ~ ¥1,500</span></div>
                    <div th:if="${restaurant.websiteUrl != null}">
                        <i class="bi bi-globe me-2 text-success"></i>
                        <a th:href="${restaurant.websiteUrl}" target="_blank" class="text-primary text-decoration-none" th:text="${restaurant.websiteUrl}">홈페이지</a>
                    </div>
                </div>
            </div>

            <!-- [전화하기 & 링크 공유하기 액션 버튼] -->
            <div class="row g-2 mt-4">
                <div class="col-6">
                    <a th:href="'tel:' + ${restaurant.phone}" class="action-btn w-100">
                        <i class="bi bi-telephone-fill text-success"></i> 전화하기
                    </a>
                </div>
                <div class="col-6">
                    <button class="action-btn w-100" onclick="navigator.clipboard.writeText(window.location.href); alert('링크가 복사되었습니다!');">
                        <i class="bi bi-share text-secondary"></i> 공유하기
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================================= -->
    <!-- [2구역: 3단 카드 (대표 메뉴 / 매장 상세 정보 / 위치 안내 칸)] -->
    <!-- ============================================================= -->
    <div class="row g-3 mb-5">

        <!-- 1. 대표 메뉴 카드 (추후 MENU 테이블 연동 대상) -->
        <div class="col-md-4">
            <div class="info-card">
                <h5 class="fw-bold mb-3">대표 메뉴</h5>
                <div class="d-flex flex-column gap-3">
                    <div class="d-flex align-items-center justify-content-between">
                        <div class="d-flex align-items-center gap-3">
                            <img src="/images/food-takoyaki.png" class="menu-thumb" alt="메뉴">
                            <div>
                                <div class="fw-bold small">타코야끼 (8개)</div>
                                <div class="text-muted" style="font-size: 0.75rem;">쿠쿠루의 시그니처 메뉴</div>
                            </div>
                        </div>
                        <div class="fw-bold small">¥680</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. 매장 세부 운영 정보 카드 -->
        <div class="col-md-4">
            <div class="info-card">
                <h5 class="fw-bold mb-3">매장 정보</h5>
                <div class="d-flex flex-column gap-3 small">
                    <div class="d-flex">
                        <span class="text-muted" style="width: 80px;"><i class="bi bi-people me-1"></i> 좌석</span>
                        <span th:text="${restaurant.seatInfo}">20석</span>
                    </div>
                    <div class="d-flex">
                        <span class="text-muted" style="width: 80px;"><i class="bi bi-calendar-check me-1"></i> 예약</span>
                        <span th:text="${restaurant.reservationInfo}">예약 불가</span>
                    </div>
                    <div class="d-flex">
                        <span class="text-muted" style="width: 80px;"><i class="bi bi-credit-card me-1"></i> 결제</span>
                        <span th:text="${restaurant.paymentMethods}">현금, 카드</span>
                    </div>
                    <div class="d-flex">
                        <span class="text-muted" style="width: 80px;"><i class="bi bi-translate me-1"></i> 언어</span>
                        <span th:text="${restaurant.languages}">일본어, 한국어</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. 위치 안내 자리 (지도 API 연동 전 임시 홀더 유지) -->
        <div class="col-md-4">
            <div class="info-card d-flex flex-column justify-content-between">
                <div>
                    <h5 class="fw-bold mb-3">위치</h5>
                    <div class="ratio ratio-4x3 rounded-3 overflow-hidden map-placeholder">
                        <i class="bi bi-geo-alt fs-1 mb-2 text-secondary"></i>
                        <span class="small fw-semibold">지도 준비 중</span>
                        <span class="text-muted" style="font-size: 0.75rem;">추후 지도 연동 예정</span>
                    </div>
                </div>
                <!-- 준비 중 비활성화 버튼 -->
                <button type="button" class="btn btn-outline-secondary btn-sm mt-3 w-100 disabled" style="cursor: not-allowed;">
                    지도로 크게 보기 (준비 중)
                </button>
            </div>
        </div>

    </div>
</main>

<!-- 부트스트랩 번들 스크립트 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
